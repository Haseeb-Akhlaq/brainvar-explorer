# Local development stack: Postgres, Django API, Vite frontend.
#
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml logs -f backend
#   docker compose -f docker-compose.local.yml down          # keep data
#   docker compose -f docker-compose.local.yml down -v       # wipe data
#
# Host ports are chosen to coexist with other local projects:
#   db 5433, backend 8001, frontend 5173.

name: brainvar-local

services:
  db:
    image: postgres:16-alpine
    container_name: brainvar_db_local
    # Supplies POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD to the image.
    env_file:
      - backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      # $$ defers expansion to the container shell, where env_file vars exist.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - brainvar_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brainvar_backend_local
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      # Raw source files, read-only: the loader reads them, nothing writes them.
      - ./data/brainvar:/data:ro
    ports:
      - "8001:8000"
    env_file:
      - backend/.env
    environment:
      # Inside the compose network the DB is reached by service name, not
      # localhost:5433. These override the host-oriented values in .env.
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - RUN_MIGRATIONS=true
      - BRAINVAR_DATA_DIR=/data
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,[::1],backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - brainvar_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: brainvar_frontend_local
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    ports:
      - "5173:5173"
    environment:
      # Browser-side URL of the API (the browser is on the host, not in the network).
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers the ::1 entry in
      # /etc/hosts, but Vite listens on IPv4 only.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - brainvar_network

volumes:
  postgres_data:
  backend_static:

networks:
  brainvar_network:
    driver: bridge
