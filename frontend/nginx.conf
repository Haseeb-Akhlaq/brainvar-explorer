# Serves the built single-page app. TLS, /api/ routing and security headers
# are handled by the outer reverse proxy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so assets can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must not be cached, or a deploy leaves clients on old assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
