# ---------------------------------------------------------------------------
# BrainVar Trajectory Explorer — split origins.
#
#   brainvar.haseebakhlaq.com       -> the React build      (frontend container)
#   api.brainvar.haseebakhlaq.com   -> Django + admin        (backend container)
#
# Because the two are different origins, the API must send CORS headers and
# session cookies are cross-site. Django is configured for that in settings.py
# (CORS_ALLOWED_ORIGINS, CSRF_TRUSTED_ORIGINS, SESSION_COOKIE_SAMESITE=None).
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

upstream frontend {
    server frontend:80;
}

upstream backend {
    server backend:8000;
}

# Shared proxy settings. X-Forwarded-Proto is what tells Django the original
# request was HTTPS, since TLS terminates here.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# --- HTTP: ACME challenges, everything else redirected ---------------------
server {
    listen 80;
    listen [::]:80;
    server_name brainvar.haseebakhlaq.com api.brainvar.haseebakhlaq.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the React application ------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brainvar.haseebakhlaq.com;

    ssl_certificate     /etc/letsencrypt/live/brainvar.haseebakhlaq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brainvar.haseebakhlaq.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # connect-src must name the API origin, since it is no longer 'self'.
    #
    # style-src / font-src name Google Fonts because index.html loads Outfit
    # and Spline Sans Mono from there. Without them the stylesheet is refused
    # and the whole app silently falls back to system fonts — which is what
    # production was doing, since the <link> was present but never applied.
    #
    # img-src deliberately does NOT include blob:. The PNG export hands the
    # <img> a data: URL instead, so nothing here needs widening for it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.brainvar.haseebakhlaq.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;

    location / {
        proxy_pass http://frontend;
    }
}

# --- HTTPS: the API ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.brainvar.haseebakhlaq.com;

    ssl_certificate     /etc/letsencrypt/live/brainvar.haseebakhlaq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brainvar.haseebakhlaq.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # An API host should never be framed and has no reason to be a document.
    add_header X-Frame-Options "DENY" always;

    # Login endpoints get a tighter limit than general reads.
    location ~ ^/(admin/login|api-auth)/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://backend;
    }

    # Django's collected static files (admin CSS, DRF browsable API), written
    # to a shared volume by collectstatic in the backend entrypoint.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
